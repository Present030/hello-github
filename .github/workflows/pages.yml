# GitHub Pages source is configured to use GitHub Actions.
name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "VERSION"
      - "tools/render_site.py"
      - "tools/check_site_links.py"
      - ".github/workflows/pages.yml"
  # Keep the public feed in sync with both healthy and failed main CI snapshots.
  workflow_run:
    workflows: ["project-health"]
    types: [completed]
  # Re-evaluate expiration even during long periods with no code changes.
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      permission_probe:
        description: Verify Pages token cannot write repository contents
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.name == 'project-health' && github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Never checkout code from a workflow_run payload with write permissions.
          ref: main

      - name: Audit current tree for accidental public exposure
        run: python tools/audit_public_exposure.py
      - name: Verify Pages token cannot write repository contents
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.permission_probe }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="__pages_permission_probe_${GITHUB_RUN_ID}"
          ref="refs/heads/${branch}"

          set +e
          output="$(gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="$ref" \
            -f sha="$GITHUB_SHA" 2>&1)"
          code=$?
          set -e

          printf '%s\n' "$output"
          if [[ "$code" -eq 0 ]]; then
            echo "ERROR: contents write unexpectedly succeeded" >&2
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/git/refs/heads/${branch}" \
              >/dev/null 2>&1 || true
            exit 23
          fi

          if [[ "$output" != *"HTTP 403"* && "$output" != *"Resource not accessible by integration"* ]]; then
            echo "ERROR: write failed for an unexpected reason" >&2
            exit 24
          fi

          echo "PASS: Pages token with contents: read rejected Git ref creation"

      - name: Render website from repository state
        run: python tools/render_site.py

      - name: Fetch current-main health evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(git rev-parse HEAD)"
          echo "PAGES_MAIN_SHA=$main_sha" >> "$GITHUB_ENV"
          mkdir -p health-source
          source_id=0

          # Select only the latest completed project-health run for the exact
          # checked-out main SHA. Do not fall back to an older green artifact.
          if gh api "repos/$GITHUB_REPOSITORY/actions/workflows/project-health.yml/runs?per_page=100" > health-runs.json; then
            candidate="$(jq -r --arg sha "$main_sha" '
              [.workflow_runs[]
               | select(.head_sha == $sha and .event == "workflow_run" and .status == "completed")]
              | sort_by(.id) | last | .id // empty
            ' health-runs.json)"
            if [[ "$candidate" =~ ^[0-9]+$ ]]; then
              if gh run download "$candidate" --repo "$GITHUB_REPOSITORY" --name project-health --dir health-source; then
                if test -f health-source/project-health.json; then
                  source_id="$candidate"
                fi
              fi
            fi
          else
            echo "Health API unavailable; publishing unknown instead of old green status"
          fi

          echo "HEALTH_SOURCE_RUN_ID=$source_id" >> "$GITHUB_ENV"

      - name: Render allowlisted public status
        shell: bash
        run: |
          set -euo pipefail
          if test "$HEALTH_SOURCE_RUN_ID" -gt 0; then
            python tools/build_public_status.py \
              --snapshot health-source/project-health.json \
              --main-sha "$PAGES_MAIN_SHA" \
              --source-run-id "$HEALTH_SOURCE_RUN_ID" \
              --output dist/site/status.json
          else
            python tools/build_public_status.py \
              --main-sha "$PAGES_MAIN_SHA" \
              --output dist/site/status.json
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1


      - name: Verify deployed page matches rendered artifact
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          import time
          import urllib.request
          from pathlib import Path

          expected = Path("dist/site/index.html").read_bytes()
          expected_sha = hashlib.sha256(expected).hexdigest()
          page_url = os.environ["PAGE_URL"]
          separator = "&" if "?" in page_url else "?"
          probe_url = f"{page_url}{separator}deployment={os.environ['GITHUB_SHA']}"

          last_sha = None
          for attempt in range(1, 11):
              request = urllib.request.Request(
                  probe_url,
                  headers={
                      "Cache-Control": "no-cache",
                      "User-Agent": "hello-github-pages-verifier",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      actual = response.read()
              except Exception as exc:
                  print(f"Attempt {attempt}/10: fetch failed: {type(exc).__name__}")
              else:
                  last_sha = hashlib.sha256(actual).hexdigest()
                  if actual == expected:
                      print(
                          "PASS: public GitHub Pages content matches the rendered "
                          f"artifact byte-for-byte (sha256={expected_sha})"
                      )
                      raise SystemExit(0)
                  print(
                      f"Attempt {attempt}/10: live sha256={last_sha}; "
                      f"expected sha256={expected_sha}"
                  )

              if attempt < 10:
                  time.sleep(3)

          raise SystemExit(
              "Public GitHub Pages content did not converge to the rendered "
              f"artifact; expected={expected_sha} last={last_sha}"
          )
          PY


      - name: Verify published status feed matches rendered JSON
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import time
          import urllib.request
          from pathlib import Path

          expected = Path("dist/site/status.json").read_bytes()
          page_url = os.environ["PAGE_URL"].rstrip("/")
          uri = f"{page_url}/status.json?deployment={os.environ['GITHUB_SHA']}"
          for attempt in range(1, 11):
              try:
                  req = urllib.request.Request(uri, headers={"Cache-Control": "no-cache"})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      actual = response.read()
                  if actual == expected:
                      print("PASS: public status feed matches allowlisted JSON byte-for-byte")
                      break
              except Exception as exc:
                  print(f"Status fetch attempt {attempt}: {type(exc).__name__}")
              if attempt == 10:
                  raise SystemExit("public status feed did not match deployed data")
              time.sleep(3)
          PY

      - name: Verify published project links
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python tools/check_site_links.py --page-url "$PAGE_URL"
