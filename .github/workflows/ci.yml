name: workspace-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  public-exposure:
    name: public exposure audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Audit full Git history for secrets and privacy indicators
        run: python tools/audit_public_exposure.py --history

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Audit workflow security policy
        if: ${{ matrix.python-version == '3.13' }}
        run: python tools/audit_workflow_security.py
      - name: Verify reproducible zipapp
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_zipapp.py --output dist/hello-github-a.pyz
          python tools/build_zipapp.py --output dist/hello-github-b.pyz
          cmp dist/hello-github-a.pyz dist/hello-github-b.pyz
          python dist/hello-github-a.pyz --json > zipapp-runtime-report.json
          python -c "import hashlib, pathlib; print('ZIPAPP_SHA256=' + hashlib.sha256(pathlib.Path('dist/hello-github-a.pyz').read_bytes()).hexdigest())"
      - name: Verify executable-only SBOM scope
        if: ${{ matrix.python-version == '3.13' }}
        run: |
          python tools/build_sbom.py --artifact dist/hello-github-a.pyz --version "$(cat VERSION)" --output dist/hello-github.cdx.json
          python tools/check_sbom_scope.py --artifact dist/hello-github-a.pyz --sbom dist/hello-github.cdx.json
      - name: Generate runtime report
        run: python -m hello_github --json > runtime-report.json
      - name: Verify source and zipapp reports match
        run: cmp runtime-report.json zipapp-runtime-report.json
      - name: Upload runtime report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-report-py${{ matrix.python-version }}
          path: runtime-report.json

  portable:
    name: portable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build zipapp twice
        run: |
          python tools/build_zipapp.py --output dist/hello-github-a.pyz
          python tools/build_zipapp.py --output dist/hello-github-b.pyz
      - name: Verify deterministic bytes
        run: python -c "from pathlib import Path; assert Path('dist/hello-github-a.pyz').read_bytes() == Path('dist/hello-github-b.pyz').read_bytes()"
      - name: Run zipapp
        run: python dist/hello-github-a.pyz --json > zipapp-runtime-report.json
      - name: Generate source report
        run: python -m hello_github --json > runtime-report.json
      - name: Verify source and zipapp reports match
        run: python -c "from pathlib import Path; assert Path('runtime-report.json').read_bytes() == Path('zipapp-runtime-report.json').read_bytes()"
      - name: Print zipapp SHA256
        run: python -c "import hashlib, pathlib; print('ZIPAPP_SHA256=' + hashlib.sha256(pathlib.Path('dist/hello-github-a.pyz').read_bytes()).hexdigest())"


  browser-e2e:
    name: browser E2E (Chrome + Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Verify browser runner
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          google-chrome --version
      - name: Render real website
        run: python tools/render_site.py
      - name: Exercise real browser with success and failure status fixtures
        run: python tools/check_site_browser.py --site dist/site/index.html
      - name: Exercise responsive layouts, keyboard access and failure fallbacks
        run: python tools/check_site_compatibility.py --site dist/site/index.html

  site-portability:
    name: site portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Render website
        run: python tools/render_site.py
      - name: Print website SHA256
        run: python -c "import hashlib, pathlib; p=pathlib.Path('dist/site/index.html'); print('SITE_SHA256=' + hashlib.sha256(p.read_bytes()).hexdigest())"
      - name: Upload rendered website
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ matrix.os }}
          path: dist/site/index.html

  site-portability-compare:
    name: site portability compare
    runs-on: ubuntu-latest
    needs: site-portability
    steps:
      - name: Download Ubuntu website
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-ubuntu-latest
          path: site-ubuntu
      - name: Download Windows website
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-windows-latest
          path: site-windows
      - name: Download macOS website
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-macos-latest
          path: site-macos
      - name: Compare rendered website bytes
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          paths = {
              "ubuntu": Path("site-ubuntu/index.html"),
              "windows": Path("site-windows/index.html"),
              "macos": Path("site-macos/index.html"),
          }
          payloads = {name: path.read_bytes() for name, path in paths.items()}
          hashes = {
              name: hashlib.sha256(data).hexdigest()
              for name, data in payloads.items()
          }
          for name, digest in hashes.items():
              print(f"{name}: {digest}")

          if len(set(payloads.values())) != 1:
              raise SystemExit("Rendered website differs across operating systems")

          digest = next(iter(hashes.values()))
          print(
              "PASS: Linux, Windows, and macOS rendered the website "
              f"byte-for-byte identically (sha256={digest})"
          )
          PY

  gate:
    name: workspace-ci gate
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - public-exposure
      - test
      - portable
      - site-portability-compare
      - browser-e2e
    steps:
      - name: Verify required jobs succeeded
        shell: bash
        env:
          PUBLIC_EXPOSURE_RESULT: ${{ needs.public-exposure.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PORTABLE_RESULT: ${{ needs.portable.result }}
          SITE_PORTABILITY_COMPARE_RESULT: ${{ needs.site-portability-compare.result }}
          BROWSER_E2E_RESULT: ${{ needs.browser-e2e.result }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            "public-exposure=${PUBLIC_EXPOSURE_RESULT}" \
            "test=${TEST_RESULT}" \
            "portable=${PORTABLE_RESULT}" \
            "site-portability-compare=${SITE_PORTABILITY_COMPARE_RESULT}" \
            "browser-e2e=${BROWSER_E2E_RESULT}"

          for result in \
            "$PUBLIC_EXPOSURE_RESULT" \
            "$TEST_RESULT" \
            "$PORTABLE_RESULT" \
            "$SITE_PORTABILITY_COMPARE_RESULT" \
            "$BROWSER_E2E_RESULT"
          do
            test "$result" = success
          done
