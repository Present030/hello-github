name: workspace-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  public-exposure:
    name: public exposure audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Audit full Git history for secrets and privacy indicators
        run: python tools/audit_public_exposure.py --history

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Audit workflow security policy
        if: ${{ matrix.python-version == '3.13' }}
        run: python tools/audit_workflow_security.py
      - name: Verify reproducible zipapp
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_zipapp.py --output dist/hello-github-a.pyz
          python tools/build_zipapp.py --output dist/hello-github-b.pyz
          cmp dist/hello-github-a.pyz dist/hello-github-b.pyz
          python dist/hello-github-a.pyz --json > zipapp-runtime-report.json
          python -c "import hashlib, pathlib; print('ZIPAPP_SHA256=' + hashlib.sha256(pathlib.Path('dist/hello-github-a.pyz').read_bytes()).hexdigest())"
      - name: Generate runtime report
        run: python -m hello_github --json > runtime-report.json
      - name: Verify source and zipapp reports match
        run: cmp runtime-report.json zipapp-runtime-report.json
      - name: Upload runtime report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-report-py${{ matrix.python-version }}
          path: runtime-report.json

  portable:
    name: portable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build zipapp twice
        run: |
          python tools/build_zipapp.py --output dist/hello-github-a.pyz
          python tools/build_zipapp.py --output dist/hello-github-b.pyz
      - name: Verify deterministic bytes
        run: python -c "from pathlib import Path; assert Path('dist/hello-github-a.pyz').read_bytes() == Path('dist/hello-github-b.pyz').read_bytes()"
      - name: Run zipapp
        run: python dist/hello-github-a.pyz --json > zipapp-runtime-report.json
      - name: Generate source report
        run: python -m hello_github --json > runtime-report.json
      - name: Verify source and zipapp reports match
        run: python -c "from pathlib import Path; assert Path('runtime-report.json').read_bytes() == Path('zipapp-runtime-report.json').read_bytes()"
      - name: Print zipapp SHA256
        run: python -c "import hashlib, pathlib; print('ZIPAPP_SHA256=' + hashlib.sha256(pathlib.Path('dist/hello-github-a.pyz').read_bytes()).hexdigest())"
