name: release

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "VERSION must be semantic version X.Y.Z; got: $version" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build reproducible versioned zipapp
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_zipapp.py --output dist/hello-github.pyz
          python tools/build_zipapp.py --output dist/hello-github-rebuild.pyz
          cmp dist/hello-github.pyz dist/hello-github-rebuild.pyz
          rm dist/hello-github-rebuild.pyz
          python dist/hello-github.pyz --version > artifact-version.txt
          test "$(cat artifact-version.txt)" = "$RELEASE_VERSION"
          python dist/hello-github.pyz --json > runtime-report.json
          python -c "import json, os; report=json.load(open('runtime-report.json', encoding='utf-8')); assert report['version'] == os.environ['RELEASE_VERSION'], report"

      - name: Build deterministic CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_sbom.py \
            --artifact dist/hello-github.pyz \
            --version "$RELEASE_VERSION" \
            --output hello-github.cdx.json
          python tools/build_sbom.py \
            --artifact dist/hello-github.pyz \
            --version "$RELEASE_VERSION" \
            --output hello-github-second.cdx.json
          cmp hello-github.cdx.json hello-github-second.cdx.json
          rm hello-github-second.cdx.json

      - name: Build release manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "tag=$RELEASE_TAG"
            echo "version=$RELEASE_VERSION"
            echo "commit=$GITHUB_SHA"
            sha256sum runtime-report.json
            sha256sum dist/hello-github.pyz
            sha256sum hello-github.cdx.json
          } > release-manifest.txt

      - name: Build and self-verify recovery bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf recovery-input recovery-verify
          mkdir -p recovery-input/release
          cp dist/hello-github.pyz recovery-input/release/
          cp runtime-report.json recovery-input/release/
          cp release-manifest.txt recovery-input/release/

          for name in a b; do
            python tools/build_recovery_bundle.py \
              --release-dir recovery-input/release \
              --sbom hello-github.cdx.json \
              --repository "$GITHUB_REPOSITORY" \
              --tag "$RELEASE_TAG" \
              --target-commit "$GITHUB_SHA" \
              --output "dist/hello-github-recovery-$name.zip"
          done
          cmp dist/hello-github-recovery-a.zip dist/hello-github-recovery-b.zip
          mv dist/hello-github-recovery-a.zip dist/hello-github-recovery.zip
          rm dist/hello-github-recovery-b.zip

          mkdir recovery-verify
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          with ZipFile("dist/hello-github-recovery.zip") as archive:
              archive.extractall(Path("recovery-verify"))
          PY
          python recovery-verify/verify.py
          cmp recovery-verify/release/hello-github.pyz dist/hello-github.pyz

      - name: Create or reuse GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; reusing it for verification."
          else
            gh release create "$RELEASE_TAG" \
              runtime-report.json \
              release-manifest.txt \
              dist/hello-github.pyz \
              hello-github.cdx.json \
              dist/hello-github-recovery.zip \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes "Persistent Workspace Lab release $RELEASE_TAG"
          fi

      - name: Verify release assets round-trip
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf verify-release verify-recovery
          mkdir verify-release verify-recovery
          gh release download "$RELEASE_TAG" --dir verify-release

          cmp runtime-report.json verify-release/runtime-report.json
          cmp release-manifest.txt verify-release/release-manifest.txt
          cmp dist/hello-github.pyz verify-release/hello-github.pyz
          cmp hello-github.cdx.json verify-release/hello-github.cdx.json
          cmp dist/hello-github-recovery.zip verify-release/hello-github-recovery.zip

          python verify-release/hello-github.pyz --version > downloaded-version.txt
          test "$(cat downloaded-version.txt)" = "$RELEASE_VERSION"
          python verify-release/hello-github.pyz --json > downloaded-runtime-report.json
          cmp runtime-report.json downloaded-runtime-report.json

          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          with ZipFile("verify-release/hello-github-recovery.zip") as archive:
              archive.extractall(Path("verify-recovery"))
          PY
          python verify-recovery/verify.py
          cmp verify-recovery/release/hello-github.pyz verify-release/hello-github.pyz

          echo "PASS: release tag, executable, SBOM, recovery bundle, and runtime evidence all agree"
