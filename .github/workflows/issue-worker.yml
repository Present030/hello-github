name: issue-worker

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  workspace-probe:
    if: ${{ github.actor == github.repository_owner && (github.event.issue.title == '[workspace-probe]' || github.event.issue.title == '[workspace-probe-fail]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run tests
        id: tests
        continue-on-error: true
        run: python -m unittest discover -s tests -v

      - name: Run controlled probe contract
        id: probe
        continue-on-error: true
        shell: bash
        env:
          TASK_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          if [[ "$TASK_TITLE" == "[workspace-probe-fail]" ]]; then
            echo "Intentional failure probe requested."
            exit 23
          fi
          echo "Probe contract passed."

      - name: Generate runtime report
        id: report
        continue-on-error: true
        run: python -m hello_github --json > runtime-report.json

      - name: Build issue result
        if: ${{ always() }}
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("runtime-report.json")
          report = None
          if report_path.exists():
              try:
                  report = json.loads(report_path.read_text(encoding="utf-8"))
              except Exception as exc:
                  report = {"error": f"runtime report parse failed: {exc}"}

          test_outcome = os.environ["TEST_OUTCOME"]
          probe_outcome = os.environ["PROBE_OUTCOME"]
          report_outcome = os.environ["REPORT_OUTCOME"]
          success = all(value == "success" for value in (test_outcome, probe_outcome, report_outcome))

          lines = [
              "## Workspace probe result",
              "",
              f"- commit: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- tests: `{test_outcome}`",
              f"- probe: `{probe_outcome}`",
              f"- runtime report: `{report_outcome}`",
              f"- overall: `{'success' if success else 'failure'}`",
              "",
          ]

          if report is not None:
              lines.extend([
                  "```json",
                  json.dumps(report, indent=2, sort_keys=True),
                  "```",
                  "",
              ])

          lines.extend([
              "The issue body is intentionally ignored; this workflow does not execute user-supplied commands.",
              "",
              "Successful probes are closed automatically. Failed probes remain open for diagnosis.",
          ])
          Path("issue-result.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Post result
        id: post
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file issue-result.md

      - name: Close successful task issue
        if: ${{ steps.tests.outcome == 'success' && steps.probe.outcome == 'success' && steps.report.outcome == 'success' && steps.post.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --reason completed

      - name: Enforce task failure
        if: ${{ always() && (steps.tests.outcome != 'success' || steps.probe.outcome != 'success' || steps.report.outcome != 'success' || steps.post.outcome != 'success') }}
        run: |
          echo "Workspace probe failed; see the Issue comment for details."
          exit 1

  network-probe:
    if: ${{ github.actor == github.repository_owner && github.event.issue.title == '[network-probe]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run fixed network probe
        id: network
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import socket
          import urllib.request
          from pathlib import Path

          host = "example.com"
          target = "https://example.com/"
          result = {
              "host": host,
              "target": target,
              "dns_addresses": [],
              "http_status": None,
              "ok": False,
          }

          try:
              result["dns_addresses"] = sorted(
                  {entry[4][0] for entry in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)}
              )
              request = urllib.request.Request(
                  target,
                  method="HEAD",
                  headers={"User-Agent": "hello-github-network-probe/1"},
              )
              with urllib.request.urlopen(request, timeout=10) as response:
                  result["http_status"] = response.status
              result["ok"] = 200 <= int(result["http_status"]) < 400
          except Exception as exc:
              result["error"] = f"{type(exc).__name__}: {exc}"

          Path("network-report.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          raise SystemExit(0 if result["ok"] else 1)
          PY

      - name: Build network result
        if: ${{ always() }}
        shell: bash
        env:
          NETWORK_OUTCOME: ${{ steps.network.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("network-report.json")
          report = {"error": "network-report.json was not produced"}
          if path.exists():
              report = json.loads(path.read_text(encoding="utf-8"))

          lines = [
              "## Network probe result",
              "",
              f"- commit: `{os.environ['GITHUB_SHA']}`",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- network step: `{os.environ['NETWORK_OUTCOME']}`",
              "",
              "```json",
              json.dumps(report, indent=2, sort_keys=True),
              "```",
              "",
              "The target is fixed in the workflow. The issue body is ignored and cannot supply a URL or command.",
          ]
          Path("network-result.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Post network result
        id: post
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file network-result.md

      - name: Close successful network probe
        if: ${{ steps.network.outcome == 'success' && steps.post.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --reason completed

      - name: Enforce network probe failure
        if: ${{ always() && (steps.network.outcome != 'success' || steps.post.outcome != 'success') }}
        run: |
          echo "Network probe failed; see the Issue comment for details."
          exit 1

  cache-probe:
    if: ${{ github.actor == github.repository_owner && github.event.issue.title == '[cache-probe]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Restore previous probe state
        uses: actions/cache@v4
        with:
          path: .cache-probe
          key: workspace-counter-${{ github.run_id }}
          restore-keys: |
            workspace-counter-

      - name: Advance cached counter
        id: counter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache-probe
          previous=0
          if [[ -f .cache-probe/state.txt ]]; then
            previous="$(cat .cache-probe/state.txt)"
          fi
          current=$((previous + 1))
          printf '%s\n' "$current" > .cache-probe/state.txt
          {
            echo "previous=$previous"
            echo "current=$current"
          } >> "$GITHUB_OUTPUT"

      - name: Post cache result
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PREVIOUS: ${{ steps.counter.outputs.previous }}
          CURRENT: ${{ steps.counter.outputs.current }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "## Cache probe result

- run: `$GITHUB_RUN_ID`
- previous counter: `$PREVIOUS`
- current counter: `$CURRENT`

The counter file is restored from GitHub Actions Cache. The Issue body is ignored."

      - name: Close cache probe
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --reason completed
