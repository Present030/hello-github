name: project-health

on:
  workflow_run:
    workflows: ["workspace-ci"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  snapshot:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Fetch current GitHub state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > latest-release.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=100" > workflow-runs.json

      - name: Re-run durable state and workflow security audits
        shell: bash
        run: |
          set -euo pipefail
          python tools/audit_state.py --release-json latest-release.json
          python tools/audit_workflow_security.py

      - name: Build project health snapshot
        shell: bash
        env:
          VERIFIED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          python tools/build_health_snapshot.py \
            --version-file VERSION \
            --release-json latest-release.json \
            --runs-json workflow-runs.json \
            --head-sha "$VERIFIED_HEAD_SHA" \
            --output project-health.json

      - name: Upload project health snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: project-health
          path: project-health.json
