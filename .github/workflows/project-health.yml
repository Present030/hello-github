name: project-health

on:
  workflow_run:
    workflows: ["workspace-ci"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  snapshot:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Fetch current GitHub state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > latest-release.json
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=100" \
            > workflow-runs.json

      - name: Re-run durable state and workflow security audits
        shell: bash
        run: |
          set -euo pipefail
          python tools/audit_state.py --release-json latest-release.json
          python tools/audit_workflow_security.py

      - name: Build project health snapshot
        shell: bash
        env:
          VERIFIED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CURRENT_CI_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          CURRENT_CI_EVENT: ${{ github.event.workflow_run.event }}
          CURRENT_CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          python tools/build_health_snapshot.py \
            --version-file VERSION \
            --release-json latest-release.json \
            --runs-json workflow-runs.json \
            --head-sha "$VERIFIED_HEAD_SHA" \
            --current-ci-run-id "$CURRENT_CI_RUN_ID" \
            --current-ci-run-number "$CURRENT_CI_RUN_NUMBER" \
            --current-ci-event "$CURRENT_CI_EVENT" \
            --current-ci-conclusion "$CURRENT_CI_CONCLUSION" \
            --output project-health.json

      - name: Upload project health snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: project-health
          path: project-health.json

  # Failure evidence must not depend on checking out a potentially broken main commit.
  # This path uses only the trusted workflow_run event and the runner's Python.
  ci-failure-snapshot:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Build degraded snapshot from CI event
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          run = event["workflow_run"]
          if (
              event["repository"]["full_name"] != os.environ["GITHUB_REPOSITORY"]
              or run["event"] != "push"
              or run["head_branch"] != "main"
              or not run.get("conclusion")
              or run["conclusion"] == "success"
          ):
              raise SystemExit("refusing to record an untrusted/non-failed main CI event")

          evidence = {
              "id": run["id"],
              "run_number": run["run_number"],
              "event": run["event"],
              "head_sha": run["head_sha"],
              "conclusion": run["conclusion"],
          }
          snapshot = {
              "schema": "hello-github-project-health/v1",
              "status": "degraded",
              "snapshot_kind": "ci_failure",
              "generated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "head_sha": run["head_sha"],
              "version": None,
              "release": {"tag": None, "target_commit": None, "assets": {}},
              "checks": {
                  "release_alignment": None,
                  "current_main_ci": False,
                  "state_drift_audit": "not_run",
                  "workflow_security_audit": "not_run",
              },
              "workflow_evidence": {"workspace-ci": evidence},
              "degraded_reasons": [f"main_ci_{run['conclusion']}"],
          }
          Path("project-health.json").write_text(
              json.dumps(snapshot, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          print(f"PROJECT_HEALTH=degraded; CI_RUN_ID={run['id']}; conclusion={run['conclusion']}")
          PY

      - name: Upload degraded health snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: project-health
          path: project-health.json
          if-no-files-found: error

      - name: Fail health workflow after preserving evidence
        shell: bash
        run: exit 1
