name: cache-probe

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  cache-probe:
    cache-mode: write
    if: ${{ github.actor == github.repository_owner && github.event.issue.title == '[cache-probe]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Restore previous probe state
        uses: actions/cache@v4
        with:
          path: .cache-probe
          key: workspace-counter-${{ github.run_id }}
          restore-keys: |
            workspace-counter-

      - name: Advance cached counter
        id: counter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache-probe
          previous=0
          if [[ -f .cache-probe/state.txt ]]; then
            previous="$(cat .cache-probe/state.txt)"
          fi
          current=$((previous + 1))
          printf '%s\n' "$current" > .cache-probe/state.txt
          {
            echo "previous=$previous"
            echo "current=$current"
          } >> "$GITHUB_OUTPUT"

      - name: Build result
        shell: bash
        env:
          PREVIOUS: ${{ steps.counter.outputs.previous }}
          CURRENT: ${{ steps.counter.outputs.current }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          lines = [
              "## Cache probe result",
              "",
              f"- run: `{os.environ['GITHUB_RUN_ID']}`",
              f"- previous counter: `{os.environ['PREVIOUS']}`",
              f"- current counter: `{os.environ['CURRENT']}`",
              "",
              "The counter file is restored from GitHub Actions Cache. The Issue body is ignored.",
          ]
          Path("cache-result.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Post cache result
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file cache-result.md

      - name: Close cache probe
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --reason completed
