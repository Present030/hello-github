<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hello-github</title>
  <meta
    name="description"
    content="hello-github：一个用来探索 GitHub、自动化、发布与长期项目连续性的实验仓库。"
  >
  <style>
    :root {
      color-scheme: light dark;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(127, 127, 127, 0.12), transparent 38%),
        Canvas;
      color: CanvasText;
    }

    main {
      width: min(720px, 100%);
      padding: clamp(28px, 6vw, 56px);
      border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
      border-radius: 24px;
      background: color-mix(in srgb, Canvas 94%, CanvasText 6%);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2.4rem, 8vw, 4.8rem);
      line-height: 0.95;
      letter-spacing: -0.055em;
    }

    p {
      margin: 0;
      max-width: 58ch;
      font-size: 1.05rem;
      line-height: 1.75;
    }

    .eyebrow {
      margin-bottom: 18px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.6;
    }

    .note {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid color-mix(in srgb, CanvasText 14%, transparent);
      font-size: 0.92rem;
      opacity: 0.72;
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Persistent Workspace Lab</div>
    <h1>hello-github</h1>
    <p>
      这是这个仓库的第一张网页。现在它还很简单，只负责证明一件事：
      仓库里的代码，可以慢慢长成一个真正的网站。
    </p>
    <p class="note">
      后面的内容会分阶段加入。今天先从这一页开始。
    </p>
  </main>
</body>
</html>
